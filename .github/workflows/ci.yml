name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Node workspaces
        run: npm run lint

      - name: Type-check Node workspaces
        run: npm run typecheck

      - name: Test Node workspaces
        run: npm test

      - name: Build Node workspaces
        run: npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test Flutter app
        working-directory: apps/mobile
        run: flutter test

      - name: Build API container
        run: docker build -f services/api/Dockerfile -t paperwork-assistant-api .
